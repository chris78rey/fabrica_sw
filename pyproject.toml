[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabrica-sw"
version = "0.2.0"
description = "Fábrica de software segura y orquestada con Graphify y LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fabrica-sw = "fabrica_sw.cli:main"

[project.optional-dependencies]
runtime = [
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.3,<1",
    "langgraph>=0.2,<1",
    "python-dotenv>=1.0,<2",
]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
